name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A permanent keystore lives in repo secrets so every build carries the SAME
      # signature — required for the phone to install updates over the previous build.
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELPLAYEROSS_FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIXELPLAYEROSS_FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXELPLAYEROSS_FORK_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets missing. Add PIXELPLAYEROSS_FORK_KEYSTORE_BASE64, PIXELPLAYEROSS_FORK_KEYSTORE_PASSWORD and PIXELPLAYEROSS_FORK_KEY_ALIAS in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release-signing.jks
          {
            echo "storeFile=release-signing.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Read app version
        run: |
          VERSION_NAME="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build universal release APK
        run: ./gradlew :app:assembleRelease -Ppixelplayer.enableAbiSplits=false

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "PixelPlayerOSS-v${VERSION_NAME}-build.${{ github.run_number }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build.${{ github.run_number }}
          name: "PixelPlayerOSS v${{ env.VERSION_NAME }} (build ${{ github.run_number }})"
          prerelease: true
          body: |
            Automated build of PixelPlayerOSS (unofficial Navidrome-focused build) from `main` at ${{ github.sha }}.
            Marked as pre-release until this build line has been device-tested.
          files: PixelPlayerOSS-v${{ env.VERSION_NAME }}-build.${{ github.run_number }}.apk
          fail_on_unmatched_files: true
