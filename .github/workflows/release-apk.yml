name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A permanent keystore lives in repo secrets so every build carries the SAME
      # signature — required for the phone to install updates over the previous
      # build. A cache-based keystore (upstream's CI approach) can evict and
      # silently rotate the signature, forcing an uninstall/reinstall.
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELPLAYEROSS_FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIXELPLAYEROSS_FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXELPLAYEROSS_FORK_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets missing. Add PIXELPLAYEROSS_FORK_KEYSTORE_BASE64, PIXELPLAYEROSS_FORK_KEYSTORE_PASSWORD and PIXELPLAYEROSS_FORK_KEY_ALIAS in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > fork-release.jks
          {
            echo "storeFile=fork-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build universal release APK
        run: ./gradlew :app:assembleRelease -Ppixelplayer.enableAbiSplits=false

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk \
            "PixelPlayerOSS-fork-${{ github.run_number }}-$SHORT_SHA.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-build-${{ github.run_number }}
          name: "fork-build ${{ github.run_number }} (${{ env.SHORT_SHA }})"
          body: |
            Automated release build of `main` at ${{ github.sha }}.
            Signed with the personal fork key. Install over previous fork-build releases.
          files: PixelPlayerOSS-fork-${{ github.run_number }}-${{ env.SHORT_SHA }}.apk
          fail_on_unmatched_files: true
